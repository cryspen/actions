name: test hax

on:
  push:

jobs:
  test-action:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: cryspen/actions/hax@franziskus/hax
        with:
          fstar: v2024.12.03
      - run: |
          echo "F* version"
          fstar.exe --version
          echo "hax version"
          cargo hax --version
